<style>
:root{--violet:#3300ff;--vert:#51cb20;--encre:#14122b;--fumee:#f5f5f5;--r:44px;--max:1160px;--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme="dark"]{--bg:#100d2b;--s1:#1a1640;--s2:#241f55;--tx:#f5f5f5;--soft:#b9b6dc;--line:rgba(255,255,255,.14);--ac:#a99bff;--shadow:rgba(0,0,0,.4)}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Roboto,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--vert);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 clamp(18px,4vw,36px)}
h1,h2,h3,h4{line-height:1.08;letter-spacing:-.02em;font-weight:900}
h1{font-size:clamp(40px,7vw,84px)}
h2{font-size:clamp(30px,4.6vw,52px)}
h3{font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.01em}
p.lead{font-size:clamp(18px,2vw,21px);color:var(--soft);max-width:60ch}
.soft{color:var(--soft)}
section.blk{padding:clamp(56px,9vw,110px) 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.head p{max-width:46ch;color:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;padding:14px 26px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:transform .2s var(--ease),background .2s,color .2s;font-size:16px}
.btn:hover{transform:translateY(-2px)}
.btn-g{background:var(--vert);color:var(--encre)}
.btn-v{background:var(--violet);color:#fff}
.btn-o{border-color:var(--line);background:transparent;color:var(--tx)}
.btn-o:hover{border-color:var(--vert)}
.btn-s{padding:9px 16px;font-size:14px;border-radius:10px}
.btn-d{background:#d93a3a;color:#fff}
#top{position:fixed;inset:0 0 auto 0;z-index:66;height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(14px,3vw,32px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#burger{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 11px;flex:none}
#burger span{display:block;height:3px;border-radius:2px;background:var(--tx);transition:transform .3s var(--ease),opacity .2s,width .3s}
#burger span:nth-child(2){width:70%}
#burger[aria-expanded="true"] span:nth-child(1){transform:translateY(9px) rotate(45deg)}
#burger[aria-expanded="true"] span:nth-child(2){opacity:0}
#burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
.brand{margin-right:auto;margin-left:6px;display:flex;align-items:center}
.brand img{height:40px;width:auto}
[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
.tools{display:flex;align-items:center;gap:10px}
#theme{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
#progress{position:fixed;top:0;left:0;height:4px;width:0;background:var(--vert);z-index:70}

#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(420px,90vw);background:var(--s1);z-index:65;transform:translateX(-102%);transition:transform .45s var(--ease);padding:96px 32px 32px;display:flex;flex-direction:column;overflow:auto;border-radius:0 var(--r) var(--r) 0;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
#drawer a.nl{display:flex;justify-content:space-between;align-items:center;font-size:clamp(26px,5vw,34px);font-weight:900;letter-spacing:-.02em;padding:10px 0;border-bottom:1px solid var(--line)}
#drawer a.nl::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--vert);transform:scale(0);transition:transform .25s var(--ease)}
#drawer a.nl:hover::after,#drawer a.nl.act::after{transform:scale(1)}
#drawer .dc{margin-top:auto;padding-top:28px;color:var(--soft);font-size:15px;line-height:1.9}
#drawer .dc a{color:var(--tx);font-weight:700}
#pre{position:fixed;inset:0;background:var(--violet);z-index:100;display:grid;place-items:center;transition:transform .7s var(--ease) .15s}

#pre svg{height:120px;width:auto;color:#fff;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.4;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}#pre svg{animation:none}html{scroll-behavior:auto}}
main{padding-top:72px;min-height:80vh}
.hero{padding:clamp(40px,7vw,96px) 0 clamp(48px,7vw,90px)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,56px);align-items:center}
.chip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);padding:7px 16px;border-radius:40px;font-size:14px;font-weight:500;margin-bottom:22px;color:var(--soft)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--vert)}
.hero h1{max-width:12ch}
.hero p.lead{margin-top:22px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}
.hero-art{position:relative;aspect-ratio:1;max-width:460px;width:100%;justify-self:center}
.hero-art .c1{position:absolute;inset:6% 0 0 6%;border-radius:50%;background:var(--vert)}
.hero-art .c2{position:absolute;left:0;top:0;width:58%;height:58%;background:var(--violet);border-radius:100% 0 0 0}
.hero-art .c3{position:absolute;right:0;bottom:0;width:42%;height:42%;border:10px solid var(--tx);border-radius:50%;opacity:.9}
.hero-art svg{position:absolute;left:50%;top:50%;height:58%;width:auto;color:#fff;transform:translate(-45%,-50%);filter:drop-shadow(0 12px 18px rgba(0,0,0,.25))}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:26px clamp(14px,2.4vw,28px);border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-size:clamp(24px,3.2vw,36px);font-weight:900;letter-spacing:-.02em}
.facts span{color:var(--soft);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.card{background:var(--s1);padding:30px;border-radius:0 var(--r) 0 0;border:1px solid var(--line);transition:transform .3s var(--ease),border-color .3s;display:flex;flex-direction:column;gap:12px}
.card:hover{transform:translateY(-6px);border-color:var(--vert)}
.card p{color:var(--soft);font-size:16px}
.ico{width:58px;height:58px;border-radius:50% 0 50% 0;background:var(--violet);display:grid;place-items:center;margin-bottom:6px}
.ico svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card:nth-child(even) .ico{background:var(--vert)}.card:nth-child(even) .ico svg{stroke:var(--encre)}
.link{font-weight:700;display:inline-flex;gap:8px;align-items:center;color:var(--ac)}
.link:hover{text-decoration:underline}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.pill{border:2px solid var(--line);background:transparent;border-radius:40px;padding:8px 18px;font-weight:500;font-size:15px;cursor:pointer;transition:background .2s,border-color .2s}
.pill:hover{border-color:var(--vert)}
.pill.on{background:var(--vert);border-color:var(--vert);color:var(--encre);font-weight:700}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.work{display:block;position:relative}
.work .fig{aspect-ratio:4/5;overflow:hidden;border-radius:0 var(--r) 0 0;background:var(--s2);position:relative}
.work .fig svg,.work .fig img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.work:hover .fig svg,.work:hover .fig img{transform:scale(1.06)}
.work h3{margin-top:14px;font-size:19px}
.work small{color:var(--soft);font-size:14px}
.provisoire{position:absolute;left:10px;top:10px;background:var(--encre);color:#fff;font-size:12px;padding:3px 10px;border-radius:20px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-left:1px solid var(--line)}
.step{padding:6px 26px 6px 24px;border-right:1px solid var(--line)}
.step b{font-size:48px;font-weight:900;color:var(--vert);line-height:1;display:block;margin-bottom:10px}
.step p{color:var(--soft);font-size:16px}
.about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(24px,5vw,64px);align-items:center}
.portrait{aspect-ratio:4/5;background:var(--violet);border-radius:0 var(--r) 0 0;position:relative;overflow:hidden}
.portrait img.ph{width:100%;height:100%;object-fit:cover}
.portrait .g{position:absolute;right:-18%;bottom:-12%;width:80%;aspect-ratio:1;border-radius:50%;background:var(--vert)}
.portrait .bl{position:absolute;left:50%;top:44%;height:46%;transform:translate(-50%,-50%)}
.note{border-left:6px solid var(--vert);background:var(--s2);padding:14px 20px;border-radius:0 14px 14px 0;margin-top:28px;font-size:16px}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.tags span{background:var(--s2);padding:7px 16px;border-radius:40px;font-size:15px;font-weight:500}
.timeline{border-left:3px solid var(--vert);padding-left:24px;display:grid;gap:26px}
.timeline b{font-size:20px}
.founders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.fcard{background:var(--s1);border:1px solid var(--line);border-radius:0 var(--r) 0 0;overflow:hidden;display:flex;flex-direction:column}
.fp{aspect-ratio:16/10;position:relative;overflow:hidden;display:grid;place-items:center}
.fp i{position:absolute;right:-8%;bottom:-40%;width:60%;aspect-ratio:1;border-radius:50%}
.fp b{position:relative;font-size:clamp(90px,14vw,150px);font-weight:900;color:#fff;line-height:1}
.fp img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{padding:26px 28px 30px;display:flex;flex-direction:column}
.fb .tags{margin-top:16px}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.post{background:var(--s1);border:1px solid var(--line);border-radius:0 var(--r) 0 0;padding:28px;display:flex;flex-direction:column;gap:10px;transition:transform .3s var(--ease)}
.post:hover{transform:translateY(-5px)}
.post small{color:var(--soft)}
.post .tg{align-self:flex-start;background:var(--violet);color:#fff;font-size:13px;padding:3px 12px;border-radius:20px}
.article{max-width:760px}
.article p{margin-top:18px;color:var(--soft);font-size:19px}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-size:clamp(18px,2.2vw,22px);font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:20px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:30px;line-height:1;color:var(--vert);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin-top:12px;color:var(--soft);max-width:70ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,60px);align-items:start}
form.f{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:15px;font-weight:500}
input,select,textarea{background:var(--s1);border:2px solid var(--line);border-radius:12px;padding:13px 16px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--vert);outline:0}
textarea{min-height:140px;resize:vertical}
.clist{display:grid;gap:14px}
.crow{display:flex;gap:16px;align-items:center;background:var(--s1);border:1px solid var(--line);padding:18px 22px;border-radius:0 28px 0 0;transition:border-color .2s}
.crow:hover{border-color:var(--vert)}
.crow .ico{width:48px;height:48px;margin:0;flex:none}
.crow b{display:block}
.crow span{color:var(--soft);font-size:15px;word-break:break-word}
.band{background:var(--violet);color:#fff;border-radius:0 var(--r) 0 var(--r);padding:clamp(32px,6vw,72px);display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:var(--vert);opacity:.95}
.band>*{position:relative;z-index:1}.band h2{max-width:16ch}
.band .btn-g{z-index:2}
.msg{padding:14px 18px;border-radius:12px;background:var(--s2);font-weight:500}
.msg.ok{border-left:6px solid var(--vert)}.msg.er{border-left:6px solid #d93a3a}
footer{background:var(--s1);border-top:1px solid var(--line);padding:56px 0 28px;margin-top:40px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.fgrid h4{font-size:16px;margin-bottom:12px}
.fgrid a,.fgrid p{display:block;color:var(--soft);font-size:15px;padding:3px 0}
.fgrid a:hover{color:var(--tx)}
.fgrid img{height:44px;margin-bottom:14px;width:auto}
.fbot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--soft)}
.fbot a.lock{opacity:.3;display:inline-flex}.fbot a.lock:hover{opacity:1}
.fbot svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
#wafab{position:fixed;right:18px;bottom:18px;z-index:45;width:58px;height:58px;border-radius:50%;background:var(--vert);display:grid;place-items:center;box-shadow:0 10px 24px var(--shadow);transition:transform .2s}
#wafab:hover{transform:scale(1.08)}
#wafab svg{width:30px;height:30px;fill:var(--encre)}
#totop{position:fixed;right:24px;bottom:90px;z-index:45;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--s1);cursor:pointer;display:none;place-items:center}
#totop.on{display:grid}
#totop svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:2.5}
#cookie{position:fixed;left:16px;bottom:16px;z-index:44;max-width:340px;background:var(--s1);border:1px solid var(--line);border-radius:0 28px 0 0;padding:18px;box-shadow:0 12px 30px var(--shadow);font-size:14px;display:none}
#cookie.on{display:block}
#cookie .btn{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err404{text-align:center;padding:60px 0}
.err404 b{font-size:clamp(100px,22vw,220px);font-weight:900;line-height:1;color:var(--violet);display:block}
.legal h2{font-size:24px;margin-top:34px}.legal p{margin-top:10px;color:var(--soft);max-width:70ch}
@media (max-width:860px){
.hero-grid,.about-grid,.two,.adm{grid-template-columns:1fr}
.fgrid{grid-template-columns:1fr 1fr}
.facts div{border-right:0;border-bottom:1px solid var(--line)}
.hero-art{max-width:320px}
#topcta{display:none}
}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.fbot{flex-direction:column}#cookie{right:16px;max-width:none;bottom:86px}}
.adm{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.atabs{display:grid;gap:8px;position:sticky;top:92px}
.atabs button{text-align:left;background:transparent;border:2px solid var(--line);border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:500}
.atabs button.on{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:0 var(--r) 0 0;padding:clamp(20px,3vw,34px)}
.panel h3{margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row small{color:var(--soft)}.row .ac{display:flex;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.kpis div{background:var(--s2);padding:18px;border-radius:12px}.kpis b{font-size:34px;font-weight:900;display:block}
.login{max-width:440px;margin:0 auto}
.pv{width:90px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--s2)}
.fbot a.lock{opacity:.3;display:inline-flex}.fbot a.lock:hover{opacity:1}.fbot svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.msg||j.error_description||''}catch(e){}const er=new Error(m||('Erreur '+r.status));er.status=r.status;throw er}
const x=await r.text();return x?JSON.parse(x):null};
const rowP=x=>({id:x.id,title:x.title,cat:x.cat,auteur:x.auteur,year:x.year||'',tone:x.tone,img:x.img||'',desc:x.description||'',prov:!!x.prov,position:x.position});
async function loadRemote(){try{
const [p,n,s]=await Promise.all([api('/rest/v1/projects?select=*&order=position.asc,created_at.desc'),api('/rest/v1/news?select=*&order=date.desc'),api('/rest/v1/site_settings?select=data&id=eq.1')]);
if(p.length)S.projects=p.map(rowP);
if(n.length)S.news=n.map(x=>({id:x.id,title:x.title,tag:x.tag,date:x.date,text:x.text}));
if(s.length)Object.assign(S.settings,s[0].data);
renderChrome();render()}catch(e){console.warn('Base indisponible, contenu par défaut affiché',e)}}

const wa=(txt='')=>`https://wa.me/${S.settings.whatsapp}${txt?`?text=${encodeURIComponent(txt)}`:''}`;

const fdate=d=>{try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const phoneFmt=n=>'+'+n.replace(/(\d{3})(\d{3})(\d{3})(\d{3})/,'$1 $2 $3 $4');
function art(p){
if(p.img) return `<img src="${p.img}" alt="${esc(p.title)}" loading="lazy">`;
const pals=[[V,G,'#fff'],[G,D,'#fff'],[D,V,G],[F,V,G],['#fff',G,V],['#241f55',G,'#fff']];
const [a,b,c]=pals[p.tone%pals.length];
const light=[G,F,'#fff'].includes(a); const tc=light?D:'#fff';
const words=p.title.split(' '),lines=[];let cur='';
words.forEach(w=>{if((cur+' '+w).trim().length>13){lines.push(cur);cur=w}else cur=(cur+' '+w).trim()});lines.push(cur);
const text=lines.slice(0,4).map((l,i)=>`<text x="28" y="${380+i*38}" font-size="34" font-weight="900" fill="${tc}" font-family="Roboto,Arial,sans-serif">${esc(l)}</text>`).join('');
let motif='';
const m=p.cat;
if(m==='Graphisme') motif=`<circle cx="290" cy="150" r="120" fill="${b}"/><path d="M0 0h170a170 170 0 0 1-170 170z" fill="${c}" opacity=".9"/>${text}`;
else if(m==='Web design'||m==='Sites web') motif=`<circle cx="320" cy="90" r="110" fill="${b}"/><rect x="40" y="90" width="320" height="230" rx="10" fill="#fff"/><rect x="40" y="90" width="320" height="30" rx="10" fill="#e6e6ef"/><rect x="58" y="136" width="170" height="16" rx="8" fill="${a}"/><rect x="58" y="164" width="110" height="10" rx="5" fill="#c7c7d8"/><rect x="58" y="190" width="80" height="26" rx="6" fill="${b}"/><rect x="58" y="240" width="90" height="60" rx="6" fill="#ececf6"/><rect x="156" y="240" width="90" height="60" rx="6" fill="#ececf6"/><rect x="254" y="240" width="90" height="60" rx="6" fill="#ececf6"/>${text.replace(/y="(\d+)"/g,(s,y)=>`y="${+y+30}"`)}`;
else if(m==='Applications mobiles') motif=`<circle cx="90" cy="110" r="90" fill="${b}"/><rect x="130" y="40" width="150" height="290" rx="26" fill="${D}"/><rect x="140" y="56" width="130" height="258" rx="18" fill="${a===D?V:'#fff'}"/><rect x="152" y="80" width="80" height="12" rx="6" fill="${b}"/><rect x="152" y="112" width="106" height="64" rx="12" fill="${b}"/><circle cx="170" cy="214" r="18" fill="${c}"/><circle cx="214" cy="214" r="18" fill="${c}" opacity=".5"/><circle cx="170" cy="258" r="18" fill="${c}" opacity=".5"/><circle cx="214" cy="258" r="18" fill="${c}"/>${text.replace(/y="(\d+)"/g,(s,y)=>`y="${+y+30}"`)}`;
else if(m==='Architecture d’intérieur') motif=`<g fill="none" stroke="${tc}" stroke-width="5"><rect x="40" y="50" width="320" height="270"/><path d="M40 190h140M180 50v140M250 320V220h110M180 190v60"/></g><path d="M250 320a60 60 0 0 1-60-60" fill="none" stroke="${b}" stroke-width="5"/><circle cx="300" cy="120" r="40" fill="${b}"/>${text.replace(/y="(\d+)"/g,(s,y)=>`y="${+y+30}"`)}`;
else if(m==='Identité visuelle') motif=`<circle cx="120" cy="130" r="80" fill="${b}"/><path d="M120 90v80M80 130h80" stroke="${c}" stroke-width="12" stroke-linecap="round"/><rect x="230" y="60" width="130" height="60" rx="8" fill="${c}"/><rect x="230" y="136" width="60" height="60" rx="8" fill="${tc}" opacity=".85"/><rect x="300" y="136" width="60" height="60" rx="8" fill="${b}"/>${text.replace(/y="(\d+)"/g,(s,y)=>`y="${+y+10}"`)}`;
else if(m==='Vidéo et photo') motif=`<rect x="40" y="60" width="320" height="200" rx="14" fill="${D}"/><circle cx="200" cy="160" r="52" fill="${b}"/><path d="M186 136l40 24-40 24z" fill="#fff"/><rect x="60" y="232" width="280" height="8" rx="4" fill="#ffffff55"/><rect x="60" y="232" width="120" height="8" rx="4" fill="${c}"/>${text.replace(/y="(\d+)"/g,(s,y)=>`y="${+y+10}"`)}`;
else motif=`<path d="M40 330V170a80 80 0 0 1 160 0v160z" fill="${b}"/><path d="M220 330V220a60 60 0 0 1 120 0v110z" fill="${c}" opacity=".9"/><circle cx="300" cy="90" r="46" fill="${tc}" opacity=".9"/>${text.replace(/y="(\d+)"/g,(s,y)=>`y="${+y+30}"`)}`;
return `<svg viewBox="0 0 400 500" role="img" aria-label="${esc(p.title)}" preserveAspectRatio="xMidYMid slice"><rect width="400" height="500" fill="${a}"/>${motif}</svg>`;
}

<h2>Responsabilité</h2><p>Nous mettons tout en œuvre pour que les informations du site soient exactes. Elles peuvent évoluer sans préavis.</p></div></section>`;
views.privacy=()=>`<section class="blk"><div class="wrap legal"><h1 style="font-size:clamp(32px,5vw,54px)">Confidentialité</h1>
<h2>Données saisies dans le formulaire</h2><p>Le formulaire de contact ne stocke rien sur le site : il prépare un message que vous envoyez vous-même via WhatsApp.</p>
<h2>Stockage local</h2><p>Le site mémorise dans votre navigateur votre choix de thème et votre accord sur l’information affichée. Aucun suivi publicitaire n’est utilisé.</p>
<h2>Vos droits</h2><p>Pour toute question ou demande de suppression d’échange, écrivez à ${esc(S.settings.email)}.</p></div></section>`;
views.notfound=()=>`<section class="blk"><div class="wrap err404"><b>404</b><h2>Cette page n’existe pas.</h2><p class="lead" style="margin:14px auto 0">Elle a peut-être changé d’adresse. Retournez à l’accueil ou parcourez nos réalisations.</p><div class="cta-row" style="justify-content:center"><a class="btn btn-g" href="#/">Retour à l’accueil</a><a class="btn btn-o" href="#/realisations">Réalisations</a></div></div></section>`;
const A={tab:'apercu',eP:null,eN:null,msg:'',rows:null};
const fld=(l,n,v='',ty='text',x='')=>`<label>${l}<input name="${n}" type="${ty}" value="${esc(v)}" ${x}></label>`;
async function loadRows(){try{const [p,n]=await Promise.all([api('/rest/v1/projects?select=*&order=position.asc,created_at.desc',{auth:true}),api('/rest/v1/news?select=*&order=date.desc',{auth:true})]);A.rows={p,n};render()}catch(e){expired(e)}}
function expired(e){if(e.status===401||e.status===403){TOKEN=null;try{sessionStorage.removeItem('elvand_tok')}catch(_){}A.rows=null;A.msg='Session expirée : reconnectez-vous.'}else A.msg='Erreur : '+e.message;render()}
const shrink=f=>new Promise(res=>{if(!f||!f.size)return res(null);const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b)},'image/jpeg',.85)};im.onerror=()=>res(null);im.src=u});
async function upload(f){const b=await shrink(f);if(!b)return'';const n=Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';await api('/storage/v1/object/site-images/'+n,{method:'POST',auth:true,body:b,headers:{'Content-Type':'image/jpeg'}});return SB+'/storage/v1/object/public/site-images/'+n}
const refresh=async()=>{A.rows=null;await loadRemote();render()};
views.admin=()=>{
if(!TOKEN)return `<section class="blk"><div class="wrap login"><h1 style="font-size:clamp(30px,4.6vw,46px)">Administration</h1><p class="soft" style="margin:10px 0 24px">Accès réservé à l’équipe ELVAND.</p>${A.msg?`<p class="msg er">${esc(A.msg)}</p>`:''}<form class="f" id="lform"><label>E-mail<input name="e" type="email" autocomplete="username" required></label><label>Mot de passe<input name="p" type="password" autocomplete="current-password" required></label><div id="lmsg" aria-live="polite"></div><button class="btn btn-v" type="submit">Se connecter</button></form></div></section>`;
if(!A.rows){loadRows();return '<section class="blk"><div class="wrap"><p class="soft">Chargement…</p></div></section>'}
const tabs=[['apercu','Aperçu'],['real','Réalisations'],['annonces','Annonces'],['textes','Textes et images'],['compte','Compte']];
const msg=A.msg?`<p class="msg ${A.msg.startsWith('Erreur')?'er':'ok'}" style="margin-bottom:14px">${esc(A.msg)}</p>`:'';
let b='';const s=S.settings;
if(A.tab==='apercu'){const e=!A.rows.p.length&&!A.rows.n.length;b=`<h3>Aperçu</h3>${msg}<div class="kpis"><div><b>${A.rows.p.length}</b>réalisations</div><div><b>${A.rows.n.length}</b>annonces</div></div>${e?'<p class="soft">La base est vide : le site affiche pour l’instant des exemples. Importez-les pour pouvoir les modifier, les remplacer ou les supprimer.</p><div class="cta-row"><button class="btn btn-g btn-s" data-a="import">Importer les exemples</button></div>':'<p class="soft">Les modifications sont publiées immédiatement sur le site.</p>'}<div class="cta-row"><a class="btn btn-o btn-s" href="#/">Voir le site</a><button class="btn btn-o btn-s" data-a="logout">Se déconnecter</button></div>`}
if(A.tab==='real'){const p=A.eP&&A.rows.p.find(x=>x.id===A.eP);
b=`<h3>Réalisations</h3>${msg}<form class="f" id="pform" style="margin:18px 0 26px"><strong>${p?'Modifier la réalisation':'Ajouter une réalisation'}</strong>${fld('Titre','title',p?.title,'text','required')}
<div class="grid2"><label>Catégorie<select name="cat">${CATS.map(c=>`<option ${p&&p.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>${fld('Année','year',p?.year||new Date().getFullYear())}</div>
<div class="grid2"><label>Réalisé par (architecture et décoration : toujours Elvis)<select name="auteur">${AUT.map(a=>`<option ${p&&p.auteur===a?'selected':''}>${a}</option>`).join('')}</select></label><label>Style du visuel par défaut<select name="tone">${[0,1,2,3,4,5].map(i=>`<option value="${i}" ${p&&p.tone===i?'selected':''}>Style ${i+1}</option>`).join('')}</select></label></div>
<label>Description<textarea name="desc">${esc(p?.description||'')}</textarea></label><label>Image (remplace le visuel par défaut)<input name="img" type="file" accept="image/*"></label>
<div class="cta-row" style="margin:0"><button class="btn btn-g btn-s" type="submit">${p?'Enregistrer':'Ajouter'}</button>${p?'<button class="btn btn-o btn-s" type="button" data-a="cancelP">Annuler</button>':''}</div></form>
${A.rows.p.map(x=>`<div class="row"><div style="display:flex;gap:14px;align-items:center"><div class="pv"><div class="fig" style="aspect-ratio:4/5;border-radius:6px;overflow:hidden">${art(rowP(x))}</div></div><div><b>${esc(x.title)}</b><br><small>${esc(x.cat)}, ${esc(x.year||'')}, par ${esc(x.auteur)}${x.prov?' · exemple à remplacer':''}</small></div></div><div class="ac"><button class="btn btn-o btn-s" data-a="editP" data-id="${esc(x.id)}">Modifier</button><button class="btn btn-d btn-s" data-a="delP" data-id="${esc(x.id)}">Supprimer</button></div></div>`).join('')||'<p class="soft">Aucune réalisation en base.</p>'}`}
if(A.tab==='annonces'){const n=A.eN&&A.rows.n.find(x=>x.id===A.eN);
b=`<h3>Annonces</h3>${msg}<form class="f" id="nform" style="margin:18px 0 26px"><strong>${n?'Modifier l’annonce':'Publier une annonce'}</strong>${fld('Titre','title',n?.title,'text','required')}<div class="grid2">${fld('Étiquette','tag',n?.tag||'Annonce')}${fld('Date','date',n?.date||new Date().toISOString().slice(0,10),'date')}</div><label>Texte<textarea name="text" required>${esc(n?.text||'')}</textarea></label>
<div class="cta-row" style="margin:0"><button class="btn btn-g btn-s" type="submit">${n?'Enregistrer':'Publier'}</button>${n?'<button class="btn btn-o btn-s" type="button" data-a="cancelN">Annuler</button>':''}</div></form>
${A.rows.n.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><br><small>${fdate(x.date)}, ${esc(x.tag)}</small></div><div class="ac"><button class="btn btn-o btn-s" data-a="editN" data-id="${esc(x.id)}">Modifier</button><button class="btn btn-d btn-s" data-a="delN" data-id="${esc(x.id)}">Supprimer</button></div></div>`).join('')||'<p class="soft">Aucune annonce en base.</p>'}`}
if(A.tab==='textes')b=`<h3>Textes et images</h3>${msg}<form class="f" id="tform">${fld('Titre de l’accueil','heroTitle',s.heroTitle)}<label>Texte de l’accueil<textarea name="heroText">${esc(s.heroText)}</textarea></label>${fld('Titre de la section À propos','aboutTitle',s.aboutTitle)}<label>Introduction de la page À propos<textarea name="aboutText">${esc(s.aboutText)}</textarea></label>
<label>Description d’Elvis (âge, parcours, compétences)<textarea name="elvisText" style="min-height:160px">${esc(s.elvisText)}</textarea></label><label>Photo d’Elvis<input name="aboutPhoto" type="file" accept="image/*"></label>
<label>Description d’André La parole<textarea name="andreText" style="min-height:130px">${esc(s.andreText)}</textarea></label><label>Photo d’André<input name="andrePhoto" type="file" accept="image/*"></label>
<div class="grid2">${fld('Numéro WhatsApp (sans +)','whatsapp',s.whatsapp)}${fld('E-mail de contact','email',s.email,'email')}</div>${fld('Lien Facebook','facebook',s.facebook)}<div class="grid2">${fld('Ville affichée','city',s.city)}${fld('Année de début','since',s.since)}</div><button class="btn btn-g btn-s" type="submit" style="justify-self:start">Enregistrer</button></form>`;
if(A.tab==='compte')b=`<h3>Compte</h3>${msg}<p class="soft" style="margin-bottom:16px">Changez votre mot de passe dès la première connexion (8 caractères minimum).</p><form class="f" id="sform">${fld('Nouveau mot de passe','newP','','password','required minlength=8 autocomplete=new-password')}<div class="cta-row" style="margin:0"><button class="btn btn-v btn-s" type="submit">Mettre à jour</button><button class="btn btn-o btn-s" type="button" data-a="logout">Se déconnecter</button></div></form>`;
return `<section class="blk"><div class="wrap"><h1 style="font-size:clamp(30px,4.6vw,46px);margin-bottom:26px">Tableau de bord</h1><div class="adm"><div class="atabs">${tabs.map(([k,l])=>`<button class="${k===A.tab?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div><div class="panel">${b}</div></div></div></section>`};
document.addEventListener('click',async e=>{
const tb=e.target.closest('[data-tab]');if(tb){A.tab=tb.dataset.tab;A.msg='';A.eP=A.eN=null;render();return}
const a=e.target.closest('[data-a]');if(!a)return;const id=a.dataset.id;
try{switch(a.dataset.a){
case 'editP':A.eP=id;A.msg='';render();window.scrollTo({top:0});break;
case 'cancelP':A.eP=null;render();break;
case 'editN':A.eN=id;A.msg='';render();break;
case 'cancelN':A.eN=null;render();break;
case 'delP':if(confirm('Supprimer cette réalisation ?')){await api('/rest/v1/projects?id=eq.'+encodeURIComponent(id),{method:'DELETE',auth:true});A.msg='Réalisation supprimée.';await refresh()}break;
case 'delN':if(confirm('Supprimer cette annonce ?')){await api('/rest/v1/news?id=eq.'+encodeURIComponent(id),{method:'DELETE',auth:true});A.msg='Annonce supprimée.';await refresh()}break;
case 'import':await api('/rest/v1/projects',{method:'POST',auth:true,headers:{Prefer:'return=minimal'},json:DEF.projects.map((p,i)=>({id:p.id,title:p.title,cat:p.cat,auteur:p.auteur,year:p.year,tone:p.tone,img:'',description:p.desc,prov:!!p.prov,position:i+1}))});await api('/rest/v1/news',{method:'POST',auth:true,headers:{Prefer:'return=minimal'},json:DEF.news.map(n=>({id:n.id,title:n.title,tag:n.tag,date:n.date,text:n.text}))});A.msg='Exemples importés.';await refresh();break;
case 'logout':TOKEN=null;try{sessionStorage.removeItem('elvand_tok')}catch(_){}A.rows=null;A.msg='';location.hash='#/';render();break}}catch(er){expired(er)}});
document.addEventListener('submit',async e=>{
const f=e.target;if(f.id==='cform'||!f.id)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));const H={Prefer:'return=minimal'};
try{
if(f.id==='lform'){const r=await api('/auth/v1/token?grant_type=password',{method:'POST',json:{email:d.e.trim(),password:d.p}});TOKEN=r.access_token;try{sessionStorage.setItem('elvand_tok',TOKEN)}catch(_){}A.msg='';A.tab='apercu';A.rows=null;render()}
if(f.id==='pform'){const old=A.eP&&A.rows.p.find(x=>x.id===A.eP);const u=await upload(f.img.files[0]);const row={title:d.title.trim(),cat:d.cat,auteur:CONSTR.includes(d.cat)?'Elvis':d.auteur,year:d.year,tone:+d.tone,description:d.desc,prov:false,img:u||(old?old.img:'')};
if(old)await api('/rest/v1/projects?id=eq.'+encodeURIComponent(old.id),{method:'PATCH',auth:true,headers:H,json:row});else await api('/rest/v1/projects',{method:'POST',auth:true,headers:H,json:row});A.msg=old?'Réalisation enregistrée.':'Réalisation ajoutée.';A.eP=null;await refresh()}
if(f.id==='nform'){const old=A.eN&&A.rows.n.find(x=>x.id===A.eN);const row={title:d.title.trim(),tag:d.tag||'Annonce',date:d.date,text:d.text};
if(old)await api('/rest/v1/news?id=eq.'+encodeURIComponent(old.id),{method:'PATCH',auth:true,headers:H,json:row});else await api('/rest/v1/news',{method:'POST',auth:true,headers:H,json:row});A.msg=old?'Annonce enregistrée.':'Annonce publiée.';A.eN=null;await refresh()}
if(f.id==='tform'){const[pe,pa]=await Promise.all([upload(f.aboutPhoto.files[0]),upload(f.andrePhoto.files[0])]);const{aboutPhoto,andrePhoto,...rest}=d;const data={...rest,aboutPhoto:pe||S.settings.aboutPhoto,andrePhoto:pa||S.settings.andrePhoto};
await api('/rest/v1/site_settings?on_conflict=id',{method:'POST',auth:true,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},json:{id:1,data}});A.msg='Textes enregistrés.';await refresh()}
if(f.id==='sform'){await api('/auth/v1/user',{method:'PUT',auth:true,json:{password:d.newP}});A.msg='Mot de passe mis à jour.';render()}
}catch(er){if(f.id==='lform'){$('#lmsg').innerHTML='<p class="msg er">E-mail ou mot de passe incorrect.</p>'}else expired(er)}});
const NAV=[['#/','Accueil'],['#/a-propos','À propos'],['#/services','Services'],['#/realisations','Réalisations'],['#/actualites','Actualités'],['#/faq','FAQ'],['#/contact','Contact']];
function renderChrome(){
const s=S.settings;
$('#drawer').innerHTML=NAV.map(([h,l])=>`<a class="nl" href="${h}">${l}</a>`).join('')+`<div class="dc"><a href="${wa()}" target="_blank" rel="noopener">WhatsApp ${phoneFmt(s.whatsapp)}</a><br><a href="${esc(s.facebook)}" target="_blank" rel="noopener">Facebook</a><br>${esc(s.city)}</div>`;
$('#foot').innerHTML=`<div class="wrap"><div class="fgrid"><div><img class="logo" src="${LOGO}" alt="ELVAND Solution"><p>Graphisme, web, applications, architecture et décoration d’intérieur.</p></div>
<div><h4>Navigation</h4>${NAV.map(([h,l])=>`<a href="${h}">${l}</a>`).join('')}</div>
<div><h4>Contact</h4><a href="${wa()}" target="_blank" rel="noopener">${phoneFmt(s.whatsapp)}</a><a href="mailto:${esc(s.email)}">${esc(s.email)}</a><a href="${esc(s.facebook)}" target="_blank" rel="noopener">Facebook</a><p>${esc(s.city)}</p></div>
<div><h4>Informations</h4><a href="#/mentions-legales">Mentions légales</a><a href="#/confidentialite">Confidentialité</a></div></div>
<div class="fbot"><span>© 2024–${new Date().getFullYear()} ELVAND Studio. Tous droits réservés.</span><a class="lock" href="#/admin" aria-label="Administration"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></a></div></div>`;
$('#wafab').href=wa('Bonjour ELVAND, j’aimerais en savoir plus.');
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12}):null;
function reveal(){$$('.rv').forEach(el=>io?io.observe(el):el.classList.add('in'))}
function closeMenu(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');$('#burger').setAttribute('aria-expanded','false');$('#burger').setAttribute('aria-label','Ouvrir le menu')}
function openMenu(){$('#drawer').classList.add('on');$('#scrim').classList.add('on');$('#burger').setAttribute('aria-expanded','true');$('#burger').setAttribute('aria-label','Fermer le menu')}
const TITLES={'':'Accueil',admin:'Administration','a-propos':'À propos',services:'Services',realisations:'Réalisations',actualites:'Actualités',faq:'FAQ',contact:'Contact','mentions-legales':'Mentions légales',confidentialite:'Confidentialité'};
function render(){
const h=location.hash.replace(/^#\/?/,''); const [a,b]=h.split('/');
let html;
if(a==='') html=views.home(); else if(a==='a-propos') html=views.about(); else if(a==='services') html=views.services();
else if(a==='realisations') html=b?views.work(b):views.works(); else if(a==='actualites') html=b?views.article(b):views.news();
else if(a==='faq') html=views.faq(); else if(a==='contact') html=views.contact(); else if(a==='mentions-legales') html=views.legal();
else if(a==='confidentialite') html=views.privacy(); else if(a==='admin') html=views.admin(); else html=views.notfound();
$('#app').innerHTML=html;
document.title=(TITLES[a]!==undefined?TITLES[a]+' – ':'Page introuvable – ')+'ELVAND SOLUTION';
$$('#drawer a.nl').forEach(l=>l.classList.toggle('act',l.getAttribute('href')==='#/'+a||(a===''&&l.getAttribute('href')==='#/')));
closeMenu(); reveal();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});
$('#burger').addEventListener('click',()=>$('#drawer').classList.contains('on')?closeMenu():openMenu());
$('#scrim').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
$('#theme').addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;store.set('elvand_theme',t)});
$('#totop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
$('#cok').addEventListener('click',()=>{$('#cookie').classList.remove('on');store.set('elvand_ok',1)});
window.addEventListener('scroll',()=>{const h=document.documentElement;$('#progress').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%';$('#totop').classList.toggle('on',h.scrollTop>600)},{passive:true});
document.addEventListener('click',e=>{
const fa=e.target.closest('[data-fa]'); if(fa){galAut=fa.dataset.fa;render();return}
const au=e.target.closest('[data-aut]'); if(au){galAut=au.dataset.aut;galCat='Tout'}
const f=e.target.closest('[data-filter]'); if(f){galCat=f.dataset.filter;render();return}
const c=e.target.closest('[data-cat]'); if(c){galCat=c.dataset.cat}
});
document.addEventListener('submit',e=>{
const f=e.target; if(f.id!=='cform')return; e.preventDefault(); const d=Object.fromEntries(new FormData(f));
if(!d.nom.trim()||!d.msg.trim()){$('#cmsg').innerHTML='<p class="msg er">Indiquez votre nom et votre message.</p>';return}
const txt=`Bonjour ELVAND, je suis ${d.nom}.\nService : ${d.serv}\n${d.msg}${d.mail?`\nMon e-mail : ${d.mail}`:''}`;
$('#cmsg').innerHTML='<p class="msg ok">Votre message est prêt : WhatsApp s’ouvre dans un nouvel onglet.</p>';
window.open(wa(txt),'_blank','noopener');
});
const th=store.get('elvand_theme'); if(th) document.documentElement.dataset.theme=th;
if(!store.get('elvand_ok')) setTimeout(()=>$('#cookie').classList.add('on'),2500);
renderChrome(); render(); loadRemote();
setTimeout(()=>$('#pre').classList.add('off'),900);
</script>
</body>
